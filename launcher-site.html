<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Movie Launcher</title>
<style>
  :root{
    --void:#050708;
    --grid-line: rgba(120, 231, 255, 0.14);
    --cyan: #63e8ff;
    --cyan-bright: #b9fbff;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--void);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .grid-bg{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: drift 14s linear infinite;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, black 40%, transparent 85%);
    pointer-events:none;
    z-index:0;
  }
  @keyframes drift{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: 0 480px, 0 0; }
  }

  .glow-orb{
    position:fixed;
    width:60vmax; height:60vmax;
    top:-25vmax; left:50%; transform:translateX(-50%);
    background: radial-gradient(circle, rgba(99,232,255,0.10) 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
  }

  main{
    position:relative;
    z-index:1;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 7vh 6vw 6vh;
  }

  .eyebrow{
    color: var(--cyan);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-size: clamp(11px, 1.6vw, 13px);
    font-weight: 600;
    opacity: 0.75;
    text-shadow: 0 0 12px rgba(99,232,255,0.5);
    margin: 0 0 clamp(28px, 6vh, 48px);
  }

  .grid{
    width:100%;
    max-width: 1100px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: clamp(16px, 3vw, 28px);
  }

  .tile{
    position:relative;
    text-decoration:none;
    display:block;
    border-radius: 14px;
    isolation:isolate;
  }

  .tile-face{
    position:relative;
    aspect-ratio: 2 / 3;
    border-radius: inherit;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(5,7,8,0) 45%, rgba(5,7,8,0.92) 100%),
      radial-gradient(circle at 30% 20%, rgba(99,232,255,0.35), transparent 55%),
      linear-gradient(150deg, #0d1a1d 0%, #050708 70%);
    border: 1px solid rgba(99,232,255,0.35);
    box-shadow:
      0 0 0 1px rgba(99,232,255,0.08),
      0 0 30px rgba(99,232,255,0.16),
      0 20px 40px -18px rgba(0,0,0,0.8);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease;
  }

  .tile-face::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 30px, rgba(99,232,255,0.05) 30px 31px),
      repeating-linear-gradient(90deg, transparent 0 30px, rgba(99,232,255,0.05) 30px 31px);
    opacity:0.5;
    z-index:0;
  }

  .poster-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
  }

  .disc{
    position:absolute;
    left:50%; top:38%;
    width: 42%;
    aspect-ratio:1;
    transform: translate(-50%,-50%);
    border-radius:50%;
    border: 2px solid rgba(185,251,255,0.55);
    box-shadow:
      0 0 18px rgba(99,232,255,0.5),
      inset 0 0 18px rgba(99,232,255,0.3);
    z-index:1;
  }
  .disc::after{
    content:"";
    position:absolute; inset: 30%;
    border-radius:50%;
    background: radial-gradient(circle, var(--cyan-bright), var(--cyan) 60%, transparent 75%);
    box-shadow: 0 0 26px 5px rgba(99,232,255,0.7);
  }

  .tile-label{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 14px 12px 16px;
    z-index:2;
  }

  .tile-title{
    color:#fff;
    font-size: clamp(14px, 3.4vw, 17px);
    font-weight:800;
    letter-spacing:0.02em;
    margin:0 0 4px;
    text-shadow: 0 0 14px rgba(99,232,255,0.55);
    line-height:1.2;
  }

  .tile-sub{
    color: var(--cyan);
    font-size: clamp(9px, 2vw, 11px);
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin:0;
    opacity:0.85;
  }

  .play-badge{
    position:absolute;
    top:10px; right:10px;
    width:32px; height:32px;
    border-radius:50%;
    background: rgba(5,7,8,0.65);
    border: 1px solid rgba(99,232,255,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .play-badge svg{ width:12px; height:12px; fill:var(--cyan-bright); margin-left:1px; }

  .tile:active .tile-face{
    transform: scale(0.96);
    border-color: rgba(185,251,255,0.85);
  }

  @media (hover:hover){
    .tile:hover .tile-face{
      transform: translateY(-3px) scale(1.015);
      border-color: rgba(185,251,255,0.7);
      box-shadow:
        0 0 0 1px rgba(185,251,255,0.15),
        0 0 45px rgba(99,232,255,0.28),
        0 24px 48px -18px rgba(0,0,0,0.85);
    }
  }

  .state{
    color: rgba(180,220,225,0.6);
    text-align:center;
    padding: 60px 20px;
    font-size:14px;
    letter-spacing:0.04em;
  }
  .state.error{ color:#ff8a2b; }

  footer{
    position:relative;
    z-index:1;
    color: rgba(180,220,225,0.3);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-align:center;
    padding: 10px 20px 30px;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-bg{ animation: none; }
    .tile-face{ transition:none; }
  }
</style>
</head>
<body>

<div class="glow-orb" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<main>
  <p class="eyebrow">Approved for you</p>
  <div class="grid" id="grid">
    <p class="state" id="state">Loading movies…</p>
  </div>
</main>

<footer>Opens in the streaming app</footer>

<script>
  const JSON_URL = "https://luxury-cassata-aa9003.netlify.app/movies.json";

  const gridEl = document.getElementById("grid");

  function playIconSVG() {
    return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }

  function renderTile(movie) {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = movie.playURL;
    a.setAttribute("aria-label", "Play " + movie.title);

    const face = document.createElement("div");
    face.className = "tile-face";

    if (movie.posterURL) {
      const img = document.createElement("img");
      img.className = "poster-img";
      img.src = movie.posterURL;
      img.alt = "";
      img.loading = "lazy";
      face.appendChild(img);
    } else {
      const disc = document.createElement("div");
      disc.className = "disc";
      face.appendChild(disc);
    }

    const badge = document.createElement("div");
    badge.className = "play-badge";
    badge.innerHTML = playIconSVG();
    face.appendChild(badge);

    const label = document.createElement("div");
    label.className = "tile-label";
    const title = document.createElement("p");
    title.className = "tile-title";
    title.textContent = movie.title;
    label.appendChild(title);
    if (movie.subtitle) {
      const sub = document.createElement("p");
      sub.className = "tile-sub";
      sub.textContent = movie.subtitle;
      label.appendChild(sub);
    }
    face.appendChild(label);

    a.appendChild(face);
    return a;
  }

  async function loadMovies() {
    try {
      const res = await fetch(JSON_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const movies = Array.isArray(data.movies) ? data.movies : [];

      gridEl.innerHTML = "";
      if (movies.length === 0) {
        const p = document.createElement("p");
        p.className = "state";
        p.textContent = "No movies yet.";
        gridEl.appendChild(p);
        return;
      }
      movies.forEach((m) => gridEl.appendChild(renderTile(m)));
    } catch (err) {
      gridEl.innerHTML = "";
      const p = document.createElement("p");
      p.className = "state error";
      p.textContent = "Couldn't load the movie list. Check the connection and try again.";
      gridEl.appendChild(p);
      console.error(err);
    }
  }

  loadMovies();
</script>

</body>
</html>
